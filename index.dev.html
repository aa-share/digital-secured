<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>[DEV] Resume Preview</title>

    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-primary: #172b4d;
            --text-secondary: #5e6c84;
            --primary-color: #0052cc;
            --primary-hover: #0065ff;
            --border-radius: 12px;
            --box-shadow: 0 4px 20px rgba(9, 30, 66, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --primary-color: #388bfd;
                --primary-hover: #58a6ff;
                --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .dev-badge {
            display: inline-block;
            background-color: #eab308;
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pdf-container {
            width: 100%;
            height: 75vh;
            margin: 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .pdf-object {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .pdf-fallback {
            padding: 2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <main class="card">
        <div><span class="dev-badge">Local Dev Mode</span></div>
        <h2>Curriculum Vitae</h2>
        <div class="pdf-container" id="pdf-wrapper"></div>
        <div>
            <a id="download-link" href="#" download class="btn" rel="noopener noreferrer">
                Download PDF
            </a>
        </div>
    </main>

    <script>
        "use strict";

        document.addEventListener("DOMContentLoaded", () => {
            const pdfPath = "static/doc_99032d126ada4c86aa50a1fa46e42399.pdf";
            const pdfWrapper = document.getElementById("pdf-wrapper");
            const downloadLink = document.getElementById("download-link");

            const pdfObject = document.createElement("object");
            pdfObject.data = pdfPath;
            pdfObject.type = "application/pdf";
            pdfObject.className = "pdf-object";

            const fallbackText = document.createElement("p");
            fallbackText.className = "pdf-fallback";
            fallbackText.innerHTML = 'Unable to display PDF preview directly. Please use the button below to download the file.';

            pdfObject.appendChild(fallbackText);
            pdfWrapper.appendChild(pdfObject);

            downloadLink.href = pdfPath;
        });
    </script>

</body>
</html>
