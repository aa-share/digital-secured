<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="Secure Gateway for Resume / Curriculum Vitae Access">
    <title>Secure Resume Access</title>

    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-primary: #172b4d;
            --text-secondary: #5e6c84;
            --primary-color: #0052cc;
            --primary-hover: #0065ff;
            --border-radius: 12px;
            --box-shadow: 0 4px 20px rgba(9, 30, 66, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --primary-color: #388bfd;
                --primary-hover: #58a6ff;
                --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            line-height: 1.5;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            text-align: center;
            max-width: 900px;
            width: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .card h1, .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.975rem;
            margin-bottom: 1.5rem;
        }

        .hidden {
            display: none !important;
        }

        .turnstile-wrapper {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .pdf-container {
            width: 100%;
            height: 75vh;
            margin: 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .pdf-object {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:focus-visible {
            outline: 3px solid var(--primary-hover);
            outline-offset: 2px;
        }

        .pdf-fallback {
            padding: 2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <main class="card" id="gate-container" aria-live="polite">
        <h1>Secure Document Access</h1>
        <p>Please complete the security check below to view the document.</p>

        <div class="turnstile-wrapper">
            <div class="cf-turnstile"
                 data-sitekey="0x4AAAAAAEAJAakrytw5_lqZ"
                 data-callback="onCaptchaSuccess"
                 data-theme="auto">
            </div>
        </div>
    </main>

    <main class="card hidden" id="cv-container" tabindex="-1" aria-live="polite">
        <h2>Curriculum Vitae</h2>
        <div class="pdf-container" id="pdf-wrapper"></div>
        <div>
            <a id="download-link" href="#" download class="btn" rel="noopener noreferrer">
                Download PDF
            </a>
        </div>
    </main>

    <script>
        "use strict";

        function onCaptchaSuccess(token) {
            const pdfPath = "static/doc_99032d126ada4c86aa50a1fa46e42399.pdf";

            const gateContainer = document.getElementById("gate-container");
            const cvContainer = document.getElementById("cv-container");
            const pdfWrapper = document.getElementById("pdf-wrapper");
            const downloadLink = document.getElementById("download-link");

            // Hide verification gate and reveal CV content
            gateContainer.classList.add("hidden");
            cvContainer.classList.remove("hidden");

            // Safely inject PDF viewer using <object> with fallback link for browsers without PDF plugins
            const pdfObject = document.createElement("object");
            pdfObject.data = pdfPath;
            pdfObject.type = "application/pdf";
            pdfObject.className = "pdf-object";

            const fallbackText = document.createElement("p");
            fallbackText.className = "pdf-fallback";
            fallbackText.innerHTML = 'Unable to display PDF preview directly. Please use the button below to download the file.';

            pdfObject.appendChild(fallbackText);
            pdfWrapper.appendChild(pdfObject);

            // Configure direct download link
            downloadLink.href = pdfPath;

            // Move focus to the main container for screen readers / accessibility
            cvContainer.focus();
        }
    </script>

</body>
</html>
